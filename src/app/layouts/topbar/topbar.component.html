<header class="topbar">
	<button class="icon-button md:hidden" type="button" aria-label="Open menu" (click)="toggleMenu()">
		<span aria-hidden="true">☰</span>
	</button>

	<nav class="hidden items-center gap-7 md:flex" aria-label="Основна навігація">
		<a class="nav-button" routerLink="/about-company">Про компанію</a>
		<a routerLink="/about-water">Про воду</a>
		<a routerLink="/" fragment="products">Продукція</a>
	</nav>

	<a class="brand-link" routerLink="/" aria-label="PANACEA - головна сторінка">
		<img class="brand-mark-icon" ngSrc="interface/brand-mark-gold.webp" width="651" height="622" priority alt="" />
		<span class="brand-wordmark" aria-hidden="true"></span>
	</a>

	<div class="topbar__right">
		<nav class="hidden items-center justify-end gap-7 md:flex" aria-label="Додаткова навігація">
			<a href="/#quality" (click)="openCertificates($event)">Якість</a>
			<a routerLink="/" fragment="partnership">Партнери</a>
			<a class="nav-cta" routerLink="/" fragment="contacts">Контакти</a>
		</nav>
		<div class="topbar__contacts" aria-label="Контакти PANACEA">
			<a href="tel:+380977111077" aria-label="Зателефонувати у відділ збуту"><span class="material-symbols-outlined" aria-hidden="true">call</span></a>
			<a href="https://www.instagram.com/panacea_mineral_water" target="_blank" rel="noopener noreferrer" aria-label="Instagram PANACEA">
				<svg class="icon-instagram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<rect x="3" y="3" width="18" height="18" rx="5" />
					<circle cx="12" cy="12" r="4" />
					<circle cx="17.5" cy="6.5" r=".9" fill="currentColor" stroke="none" />
				</svg>
			</a>
			<a href="https://www.facebook.com/profile.php?id=61593882497188" target="_blank" rel="noopener noreferrer" aria-label="Facebook PANACEA">
				<svg class="icon-facebook" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
					<path d="M13.7 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5H17V3.6c-.8-.1-1.7-.2-2.5-.2-2.5 0-4.2 1.5-4.2 4.3v2.2H7.5V13h2.8v8h3.4Z" />
				</svg>
			</a>
		</div>
	</div>
</header>

@if (menuOpen()) {
	<nav class="mobile-menu md:hidden" aria-label="Mobile navigation">
		<a class="nav-button" routerLink="/about-company" (click)="closeMenu()">Про компанію</a>
		<a routerLink="/about-water" (click)="closeMenu()">Про воду</a>
		<a routerLink="/" fragment="products" (click)="closeMenu()">Продукція</a>
		<a href="/#quality" (click)="openCertificates($event)">Якість</a>
		<a routerLink="/" fragment="partnership" (click)="closeMenu()">Партнери</a>
		<a routerLink="/" fragment="contacts" (click)="closeMenu()">Контакти</a>
	</nav>
}

@if (certificatesOpen()) {
	<div class="certificates" role="dialog" aria-modal="true" aria-label="Сертифікати якості PANACEA" (click)="closeCertificates()">
		<div class="certificates__panel" (click)="$event.stopPropagation()">
			<button class="certificates__close" type="button" (click)="closeCertificates()" aria-label="Закрити сертифікати">✕</button>
			<div class="certificates__grid">
				<figure>
					<img ngSrc="certificates/certificate-arden.jpg" width="2480" height="3508" alt="Сертифікат відповідності PANACEA Arden" />
					<figcaption>PANACEA Arden</figcaption>
				</figure>
				<figure>
					<img ngSrc="certificates/certificate-diamond.jpg" width="2480" height="3508" alt="Сертифікат відповідності PANACEA Diamond" />
					<figcaption>PANACEA Diamond</figcaption>
				</figure>
				<figure class="certificates__document">
					<a href="/certificates/medical-balneological-conclusion-492-2016.pdf" target="_blank" rel="noopener noreferrer" aria-label="Відкрити медичний бальнеологічний висновок №492">
						<img ngSrc="certificates/medical-conclusion-492-preview.png" width="992" height="1404" alt="Перша сторінка медичного бальнеологічного висновку №492 від 29 вересня 2016 року" />
					</a>
					<figcaption>Медичний бальнеологічний висновок №492</figcaption>
					<a class="certificates__download" href="/certificates/medical-balneological-conclusion-492-2016.pdf" download>Завантажити PDF</a>
				</figure>
			</div>
		</div>
	</div>
}
